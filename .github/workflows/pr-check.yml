name: PR Quality Gates

on:
  pull_request:
    branches: [main, master]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Run quality gates
        run: bash hooks/pr-check.sh
