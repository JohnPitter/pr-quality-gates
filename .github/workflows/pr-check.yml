name: PR Quality Gates

on:
  pull_request:
    branches: [main, master]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks precisa do historico completo

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Run quality gates
        run: bash hooks/pr-check.sh
